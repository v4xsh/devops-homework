apiVersion: apps/v1
kind: Deployment
metadata:
  name: s20-metrics-app
  namespace: s20-app
  labels:
    app: s20-metrics-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: s20-metrics-app
  template:
    metadata:
      labels:
        app: s20-metrics-app
    spec:
      containers:
        - name: app
          image: s20-metrics-app:1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_VERSION
              value: "1.1.0"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://jaeger.s20-app.svc:4318"
            - name: OTEL_SERVICE_NAME
              value: "s20-metrics-app"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 192Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: s20-metrics-app
  namespace: s20-app
  labels:
    app: s20-metrics-app
spec:
  selector:
    app: s20-metrics-app
  ports:
    - name: http
      port: 80
      targetPort: http
