# Slim kube-prometheus-stack for a shared single-node minikube (8 CPU / 7 GB).
# Install:  helm upgrade --install kps prometheus-community/kube-prometheus-stack -n monitoring --create-namespace -f this-file
fullnameOverride: kps

# Control-plane components on minikube are not reachable on the default ports -> no point scraping them.
kubeEtcd: {enabled: false}
kubeControllerManager: {enabled: false}
kubeScheduler: {enabled: false}
kubeProxy: {enabled: false}

defaultRules:
  create: true
  rules:
    etcd: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeControllerManager: false
    kubeProxy: false
    windows: false

prometheusOperator:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 192Mi}

prometheus:
  prometheusSpec:
    retention: 6h
    retentionSize: 1GB
    scrapeInterval: 15s
    evaluationInterval: 15s
    # Pick up ServiceMonitors / PodMonitors / PrometheusRules from every namespace, not only ones labelled by this release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    resources:
      requests: {cpu: 100m, memory: 384Mi}
      limits: {memory: 1Gi}

alertmanager:
  alertmanagerSpec:
    retention: 6h
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 96Mi}

grafana:
  adminPassword: s20-grafana-admin   # lab only - in real life use an existing Secret
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL      # load any ConfigMap labelled grafana_dashboard=1 from every namespace
    resources:
      requests: {cpu: 10m, memory: 48Mi}
      limits: {memory: 128Mi}

kube-state-metrics:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}

prometheus-node-exporter:
  resources:
    requests: {cpu: 10m, memory: 24Mi}
    limits: {memory: 64Mi}
