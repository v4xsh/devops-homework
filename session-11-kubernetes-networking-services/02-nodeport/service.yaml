# NodePort: ClusterIP + a static port (30000-32767) opened on EVERY node's IP.
apiVersion: v1
kind: Service
metadata:
  name: web-service-nodeport
  namespace: s11
  labels:
    app: web-nodeport
spec:
  type: NodePort
  selector:
    app: web-nodeport
  ports:
    - name: http
      port: 80               # ClusterIP port (in-cluster)
      targetPort: 80         # container port
      nodePort: 31111        # <minikube ip>:31111 from outside the cluster
      protocol: TCP
