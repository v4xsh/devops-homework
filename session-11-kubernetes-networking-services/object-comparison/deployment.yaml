# A Deployment manages ReplicaSets; each change to the pod template creates a new RS (revision)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-deploy
  namespace: s11
  labels:
    app: demo-deploy
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: demo-deploy
  template:
    metadata:
      labels:
        app: demo-deploy
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
