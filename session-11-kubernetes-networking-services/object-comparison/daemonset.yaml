# DaemonSet: exactly one pod per (matching) node - typical for node agents (logs, metrics, CNI)
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: s11
  labels:
    app: node-agent
spec:
  selector:
    matchLabels:
      app: node-agent
  template:
    metadata:
      labels:
        app: node-agent
    spec:
      containers:
        - name: agent
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo \"agent on node $NODE_NAME\"; sleep 60; done"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests: { cpu: "5m", memory: "8Mi" }
