# Two long-running client pods used to test every Service type from INSIDE the cluster.
# curl-client : curl + busybox nslookup
# dnsutils    : official Kubernetes DNS debugging image (nslookup, dig, host)
apiVersion: v1
kind: Pod
metadata:
  name: curl-client
  namespace: s11
  labels:
    app: curl-client
spec:
  containers:
    - name: client
      image: curlimages/curl:8.5.0
      command: ["sh", "-c", "sleep 36000"]
      resources:
        requests: { cpu: "10m", memory: "16Mi" }
        limits:   { cpu: "100m", memory: "64Mi" }
---
apiVersion: v1
kind: Pod
metadata:
  name: dnsutils
  namespace: s11
  labels:
    app: dnsutils
spec:
  containers:
    - name: dnsutils
      image: registry.k8s.io/e2e-test-images/jessie-dnsutils:1.3
      command: ["sleep", "36000"]
      resources:
        requests: { cpu: "10m", memory: "16Mi" }
        limits:   { cpu: "100m", memory: "64Mi" }
