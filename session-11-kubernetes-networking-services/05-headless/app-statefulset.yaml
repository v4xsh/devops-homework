apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web
  namespace: s11
  labels:
    app: web-headless
spec:
  serviceName: web-service-headless   # governing headless service -> per-pod DNS
  replicas: 3
  selector:
    matchLabels:
      app: web-headless
  template:
    metadata:
      labels:
        app: web-headless
    spec:
      containers:
        - name: nginx-stateful
          image: nginx:1.25-alpine
          ports:
            - name: web
              containerPort: 80
          command: ["sh", "-c", "echo \"Hello from $(hostname) (StatefulSet + headless)\" > /usr/share/nginx/html/index.html && exec nginx -g 'daemon off;'"]
          resources:
            requests: { cpu: "20m", memory: "32Mi" }
            limits:   { cpu: "100m", memory: "128Mi" }
