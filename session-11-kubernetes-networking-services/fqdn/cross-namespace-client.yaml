# DNS clients in a DIFFERENT namespace (s12) used to show namespace-scoped DNS resolution
apiVersion: v1
kind: Namespace
metadata:
  name: s12
---
apiVersion: v1
kind: Pod
metadata:
  name: dnsutils-s12
  namespace: s12
spec:
  containers:
    - name: dnsutils
      image: registry.k8s.io/e2e-test-images/jessie-dnsutils:1.3
      command: ["sleep", "36000"]
      resources:
        requests: { cpu: "10m", memory: "16Mi" }
        limits:   { cpu: "100m", memory: "64Mi" }
---
apiVersion: v1
kind: Pod
metadata:
  name: curl-s12
  namespace: s12
spec:
  containers:
    - name: client
      image: curlimages/curl:8.5.0
      command: ["sh", "-c", "sleep 36000"]
      resources:
        requests: { cpu: "10m", memory: "16Mi" }
        limits:   { cpu: "100m", memory: "64Mi" }
