# Demo workloads used to practise the core kubectl troubleshooting commands.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: s14
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        tier: frontend
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: s14
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
---
# Two containers in one pod -> practise "kubectl logs/exec -c <container>"
apiVersion: v1
kind: Pod
metadata:
  name: multi
  namespace: s14
  labels:
    app: multi
spec:
  containers:
    - name: nginx
      image: nginx:1.27
    - name: sidecar
      image: busybox:1.36
      command: ["sh", "-c", "i=0; while true; do i=$((i+1)); echo \"$(date '+%H:%M:%S') sidecar tick $i\"; sleep 5; done"]
---
# Exits with an error after a few seconds -> restarts -> practise "kubectl logs --previous"
apiVersion: v1
kind: Pod
metadata:
  name: restarter
  namespace: s14
  labels:
    app: restarter
spec:
  restartPolicy: Always
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo \"$(date '+%H:%M:%S') starting worker\"; sleep 8; echo \"$(date '+%H:%M:%S') ERROR: lost connection to queue, exiting\"; exit 1"]
