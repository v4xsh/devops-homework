# BUG: the app requires DATABASE_URL but the env var is not set -> exits 1 -> CrashLoopBackOff
apiVersion: v1
kind: Pod
metadata:
  name: crashloop-app
  namespace: s14
  labels:
    scenario: crashloop
spec:
  containers:
    - name: python-app
      image: python:3.11-alpine
      command:
        - python3
        - -u
        - -c
        - |
          import os, sys, time
          print("order-service v1.4 starting, reading configuration...", flush=True)
          time.sleep(3)
          db_url = os.environ.get("DATABASE_URL")
          if not db_url:
              print("[FATAL ERROR]: DATABASE_URL environment variable is MISSING!", file=sys.stderr)
              sys.exit(1)
          print("Application started successfully, using " + db_url)
          while True:
              print("healthy"); time.sleep(10)
