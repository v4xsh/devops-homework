# The "orders-api" Service lives in namespace s14-mini, the client runs in s14.
apiVersion: v1
kind: Namespace
metadata:
  name: s14-mini
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: s14-mini
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: s14-mini
spec:
  selector:
    app: orders-api
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: dns-client
  namespace: s14
spec:
  containers:
    - name: client
      image: busybox:1.36
      env:
        - name: ORDERS_URL
          value: "http://orders-api"   # BUG: short name only resolves inside namespace s14-mini
      command: ["sh", "-c"]
      args:
        - |
          while true; do
            echo "$(date +%H:%M:%S) calling $ORDERS_URL"
            wget -q -O- -T 3 "$ORDERS_URL" | grep -o "<title>.*</title>" || echo "request FAILED"
            sleep 5
          done
