apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-web
  namespace: s14
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shop-web
  template:
    metadata:
      labels:
        app: shop-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: shop-web
  namespace: s14
spec:
  selector:
    app: shop-web       # FIX 1: matches the pod label
  ports:
    - port: 80
      targetPort: 80    # FIX 2: the port nginx actually listens on
---
apiVersion: v1
kind: Pod
metadata:
  name: svc-client
  namespace: s14
spec:
  containers:
    - name: client
      image: curlimages/curl:8.6.0
      command: ["sleep", "3600"]
