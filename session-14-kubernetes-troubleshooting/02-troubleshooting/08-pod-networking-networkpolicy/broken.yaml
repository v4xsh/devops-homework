apiVersion: v1
kind: Pod
metadata:
  name: payments-api
  namespace: s14
  labels:
    app: payments-api
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  namespace: s14
spec:
  selector:
    app: payments-api
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: checkout
  namespace: s14
  labels:
    role: checkout
spec:
  containers:
    - name: client
      image: curlimages/curl:8.6.0
      command: ["sleep", "3600"]
---
# BUG: a "lock everything down" policy was applied, but no allow rule was added
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: s14
spec:
  podSelector: {}
  policyTypes:
    - Ingress
