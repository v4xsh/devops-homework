# TaskBoard - end-to-end CI/CD + DevSecOps pipeline (final DevOps project, Vansh Dobhal 10099)
#
# This file is the project-local copy. GitHub only runs workflows from the repository root, so the identical
# pipeline lives at  devops-homework/.github/workflows/session21-final-pipeline.yml  (path-filtered to this folder).
#
#   test ─┐
#   frontend ─┤
#   sast (bandit) ─┤
#   sca (pip-audit, npm audit, trivy fs + IaC) ─┼─> build-and-scan (docker build, trivy image) ─> security-gate ─> push (GHCR) ─> deploy-kind (helm)
#   secrets (gitleaks) ─┘
name: session21-final-pipeline

on:
  push:
    branches: [main]
    paths:
      - "session-21-final-devops-project/**"
      - ".github/workflows/session21-final-pipeline.yml"
  pull_request:
    branches: [main]
    paths:
      - "session-21-final-devops-project/**"
      - ".github/workflows/session21-final-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: session21-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_DIR: session-21-final-devops-project/final-devops-project
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/taskboard-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/taskboard-frontend
  TRIVY_VERSION: "0.75.0"   # 0.67.2 release assets are no longer downloadable (install failed in the first act run)

defaults:
  run:
    working-directory: session-21-final-devops-project/final-devops-project

jobs:
  test:
    name: Unit tests + lint (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}/application/backend
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        working-directory: ${{ env.PROJECT_DIR }}/application/backend
        run: ruff check .
      - name: Pytest with coverage
        working-directory: ${{ env.PROJECT_DIR }}/application/backend
        run: pytest -v --cov=app --cov-report=term-missing --cov-fail-under=80 --junitxml=pytest-report.xml
      - uses: actions/upload-artifact@v4
        if: always() && !env.ACT
        with:
          name: pytest-report
          path: ${{ env.PROJECT_DIR }}/application/backend/pytest-report.xml

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm ci + build
        working-directory: ${{ env.PROJECT_DIR }}/application/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

  sast:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit==1.9.4
      - name: Bandit (fail on medium+ severity, medium+ confidence)
        run: bandit -c security/bandit.yaml -r application/backend/app -ll -ii -f txt

  sca:
    name: SCA + IaC scan (pip-audit, npm audit, trivy fs/config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.10.1
      - name: pip-audit (Python dependencies, OSV/PyPI advisory DB)
        run: pip-audit -r application/backend/requirements.txt --strict --desc
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: npm audit (frontend dependencies)
        working-directory: ${{ env.PROJECT_DIR }}/application/frontend
        run: npm audit --audit-level=high
      - name: Install Trivy
        run: curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin "v${TRIVY_VERSION}"
      - name: Trivy filesystem scan (vulnerabilities in lock files)
        run: trivy fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 application/
      - name: Trivy IaC misconfiguration scan (Dockerfiles, Kubernetes, Helm, Terraform)
        run: trivy config --severity HIGH,CRITICAL --ignorefile security/.trivyignore --exit-code 1 .

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
      - name: gitleaks (whole project directory)
        run: gitleaks dir . --config security/gitleaks.toml --redact --no-banner --exit-code 1

  build-and-scan:
    name: Docker build + Trivy image scan
    runs-on: ubuntu-latest
    needs: [test, frontend, sast, sca, secrets]
    steps:
      - uses: actions/checkout@v4
      - name: Build images (tag = git SHA)
        run: |
          docker build -f docker/backend.Dockerfile  -t "$BACKEND_IMAGE:${GITHUB_SHA}"  .
          docker build -f docker/frontend.Dockerfile -t "$FRONTEND_IMAGE:${GITHUB_SHA}" .
      - name: Install Trivy
        run: curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin "v${TRIVY_VERSION}"
      - name: Trivy image scan (fail on fixable HIGH/CRITICAL)
        run: |
          for img in "$BACKEND_IMAGE:${GITHUB_SHA}" "$FRONTEND_IMAGE:${GITHUB_SHA}"; do
            trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format table "$img"
          done
      - name: Save images for later jobs
        if: ${{ !env.ACT }}
        run: docker save "$BACKEND_IMAGE:${GITHUB_SHA}" "$FRONTEND_IMAGE:${GITHUB_SHA}" -o /tmp/images.tar
      - uses: actions/upload-artifact@v4
        if: ${{ !env.ACT }}
        with:
          name: images
          path: /tmp/images.tar
          retention-days: 1

  security-gate:
    name: Security gate
    runs-on: ubuntu-latest
    needs: [test, frontend, sast, sca, secrets, build-and-scan]
    if: always()
    steps:
      - name: All quality and security checks must be green
        working-directory: .
        run: |
          echo "test=${{ needs.test.result }} frontend=${{ needs.frontend.result }} sast=${{ needs.sast.result }}"
          echo "sca=${{ needs.sca.result }} secrets=${{ needs.secrets.result }} image-scan=${{ needs.build-and-scan.result }}"
          for r in "${{ needs.test.result }}" "${{ needs.frontend.result }}" "${{ needs.sast.result }}" \
                   "${{ needs.sca.result }}" "${{ needs.secrets.result }}" "${{ needs.build-and-scan.result }}"; do
            if [ "$r" != "success" ]; then echo "::error::security gate FAILED ($r)"; exit 1; fi
          done
          echo "security gate PASSED - image may be published"

  push:
    name: Push images to GHCR
    runs-on: ubuntu-latest
    needs: [security-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.act
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: images
          path: /tmp
      - name: Load images
        working-directory: .
        run: docker load -i /tmp/images.tar
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push SHA tags
        working-directory: .
        run: |
          docker push "$BACKEND_IMAGE:${GITHUB_SHA}"
          docker push "$FRONTEND_IMAGE:${GITHUB_SHA}"

  deploy-kind:
    name: Deploy with Helm to kind (ephemeral cluster on the runner)
    runs-on: ubuntu-latest
    needs: [security-gate]
    # skipped when run locally with nektos/act (event payload contains "act": true)
    if: needs.security-gate.result == 'success' && !github.event.act
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: images
          path: /tmp
      - name: Load images
        run: docker load -i /tmp/images.tar
      - uses: helm/kind-action@v1
        with:
          cluster_name: taskboard-ci
      - uses: azure/setup-helm@v4
      - name: Load images into kind
        run: |
          kind load docker-image "$BACKEND_IMAGE:${GITHUB_SHA}" --name taskboard-ci
          kind load docker-image "$FRONTEND_IMAGE:${GITHUB_SHA}" --name taskboard-ci
      - name: Lint chart
        run: helm lint helm/taskboard
      - name: helm upgrade --install
        run: |
          helm upgrade --install taskboard helm/taskboard -n final-app --create-namespace \
            --set backend.image.repository="$BACKEND_IMAGE" --set backend.image.tag="${GITHUB_SHA}" \
            --set frontend.image.repository="$FRONTEND_IMAGE" --set frontend.image.tag="${GITHUB_SHA}" \
            --set ingress.enabled=false --set monitoring.grafanaDashboard.enabled=false \
            --wait --timeout 5m
      - name: Smoke test (helm test + API call)
        run: |
          helm test taskboard -n final-app --logs
          kubectl -n final-app port-forward svc/taskboard-backend 8000:8000 &
          sleep 3
          curl -sf localhost:8000/ready
          curl -sf -X POST localhost:8000/api/tasks -H 'Content-Type: application/json' -d '{"title":"created by CI"}'
          kubectl get pods,svc,hpa -n final-app
      - name: Debug on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl describe pods -n final-app | tail -n 80
