# Startup probe demo: the app needs ~25s before nginx starts listening (slow boot).
# startupProbe allows up to 30 x 2s = 60s; liveness/readiness only start after it succeeds,
# so the slow start does not get the container killed.
apiVersion: v1
kind: Pod
metadata:
  name: startup-demo
  namespace: s13
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      command: ["/bin/sh", "-c", "echo 'warming cache for 25s...'; sleep 25; echo 'starting nginx'; exec nginx -g 'daemon off;'"]
      ports:
        - containerPort: 80
      startupProbe:
        httpGet:
          path: /
          port: 80
        failureThreshold: 30
        periodSeconds: 2
      livenessProbe:
        httpGet:
          path: /
          port: 80
        periodSeconds: 5
      readinessProbe:
        httpGet:
          path: /
          port: 80
        periodSeconds: 5
