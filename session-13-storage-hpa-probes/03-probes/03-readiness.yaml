# Readiness probe demo: nginx only reports ready once /ready.html exists.
# Until then the pod is Running but 0/1 READY and is NOT added to the Service endpoints.
apiVersion: v1
kind: Pod
metadata:
  name: readiness-demo
  namespace: s13
  labels:
    app: readiness-demo
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
      readinessProbe:
        httpGet:
          path: /ready.html
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 5
        failureThreshold: 1
---
apiVersion: v1
kind: Service
metadata:
  name: readiness-demo
  namespace: s13
spec:
  selector:
    app: readiness-demo
  ports:
    - port: 80
      targetPort: 80
