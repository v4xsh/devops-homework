apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: php-apache-hpa
  namespace: s13
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: php-apache
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50     # keep average CPU at 50% of the 200m request
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0  # default: react to load immediately
    scaleDown:
      stabilizationWindowSeconds: 60 # default is 300s; lowered so scale-down is visible in the demo
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
