# Load generator: busybox pods hitting the php-apache Service in a tight loop.
# Scale this Deployment to increase load; delete it to remove load.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: s13
  labels:
    app: load-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: busybox
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "load-generator $(hostname) started, hitting http://php-apache.s13.svc.cluster.local"
              while true; do
                wget -q -O- http://php-apache.s13.svc.cluster.local > /dev/null
              done
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 32Mi
