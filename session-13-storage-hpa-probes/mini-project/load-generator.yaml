# Extra load: 4 busybox replicas looping wget against web-service.
# Used together with the single "kubectl run load-generator" pod from the assignment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: extra-load
  namespace: s13-mini
spec:
  replicas: 4
  selector:
    matchLabels:
      app: extra-load
  template:
    metadata:
      labels:
        app: extra-load
    spec:
      containers:
        - name: busybox
          image: busybox:1.36
          command: ["/bin/sh", "-c", "while true; do wget -q -O- http://web-service > /dev/null; done"]
