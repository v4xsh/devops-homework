# emptyDir shared between two containers of the SAME pod.
# "writer" appends a timestamped line every 5s, "reader" (nginx) serves the same directory.
apiVersion: v1
kind: Pod
metadata:
  name: emptydir-shared
  namespace: s13
  labels:
    demo: emptydir
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          echo "<h1>Written by the writer container (Vansh Dobhal, 10099)</h1>" > /shared/index.html
          while true; do
            echo "$(date '+%H:%M:%S') writer heartbeat from $(hostname)" >> /shared/heartbeat.log
            sleep 5
          done
      volumeMounts:
        - name: shared-data
          mountPath: /shared
    - name: reader
      image: nginx:1.27
      ports:
        - containerPort: 80
      volumeMounts:
        - name: shared-data
          mountPath: /usr/share/nginx/html
          readOnly: true
  volumes:
    - name: shared-data
      emptyDir:
        sizeLimit: 50Mi
