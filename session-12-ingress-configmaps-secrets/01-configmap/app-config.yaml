# ConfigMap defined declaratively in YAML (method 3 of 3)
apiVersion: v1
kind: ConfigMap
metadata:
  name: yatri-app-config
  namespace: s12
  labels:
    app: yatri-backend
data:
  # simple key/value pairs -> great for env vars
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  PORT: "5000"
  DEFAULT_CURRENCY: "INR"
  MAX_BOOKING_DAYS: "30"
  # a multi-line value -> great for a mounted config file
  settings.json: |
    {
      "region": "ap-south-1",
      "maxPassengers": 6,
      "supportEmail": "support@yatri.example"
    }
