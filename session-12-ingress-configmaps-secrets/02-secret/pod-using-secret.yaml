# Consumes the Secret two ways: as env vars (secretKeyRef) and as files (secret volume)
apiVersion: v1
kind: Pod
metadata:
  name: secret-demo
  namespace: s12
  labels:
    app: secret-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 36000"]
      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: yatri-db-secret
              key: POSTGRES_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: yatri-db-secret
              key: POSTGRES_PASSWORD
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: yatri-db-secret
              key: POSTGRES_DB
        - name: API_TOKEN                     # from the secret created with kubectl
          valueFrom:
            secretKeyRef:
              name: api-token-secret
              key: token
      volumeMounts:
        - name: db-creds
          mountPath: /etc/secrets/db
          readOnly: true
      resources:
        requests: { cpu: "5m", memory: "8Mi" }
        limits:   { cpu: "50m", memory: "32Mi" }
  volumes:
    - name: db-creds
      secret:
        secretName: yatri-db-secret
        defaultMode: 0400                     # files readable only by the owner
