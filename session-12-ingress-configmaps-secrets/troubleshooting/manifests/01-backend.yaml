# Healthy backend pods for the empty-endpoints drill (label app: yatri-backend, port 5000)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yatri-backend
  namespace: s12-troubleshoot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yatri-backend
  template:
    metadata:
      labels:
        app: yatri-backend
    spec:
      containers:
        - name: backend
          image: hashicorp/http-echo:1.0
          args: ["-listen=:5000", "-text=yatri-backend OK from $(POD_NAME)"]
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          ports:
            - containerPort: 5000
          resources:
            requests: { cpu: "5m", memory: "8Mi" }
            limits:   { cpu: "50m", memory: "32Mi" }
---
apiVersion: v1
kind: Pod
metadata:
  name: debug-client
  namespace: s12-troubleshoot
spec:
  containers:
    - name: client
      image: curlimages/curl:8.5.0
      command: ["sh", "-c", "sleep 36000"]
      resources:
        requests: { cpu: "5m", memory: "8Mi" }
