# PostgreSQL server for the "trailing newline secret" drill.
# The server's password comes from a Secret written with stringData (no newline) = "mypassword"
apiVersion: v1
kind: Secret
metadata:
  name: postgres-server-secret
  namespace: s12-troubleshoot
type: Opaque
stringData:
  POSTGRES_USER: yatri_admin
  POSTGRES_PASSWORD: mypassword      # dummy lab password
  POSTGRES_DB: yatri
---
apiVersion: v1
kind: Pod
metadata:
  name: postgres
  namespace: s12-troubleshoot
  labels:
    app: postgres
spec:
  containers:
    - name: postgres
      image: postgres:16-alpine
      envFrom:
        - secretRef:
            name: postgres-server-secret
      ports:
        - containerPort: 5432
      readinessProbe:
        exec:
          command: ["pg_isready", "-U", "yatri_admin", "-d", "yatri"]
        periodSeconds: 3
      resources:
        requests: { cpu: "50m", memory: "64Mi" }
        limits:   { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: s12-troubleshoot
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
