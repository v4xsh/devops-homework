# Healthy version of the deployment (3 replicas) used before the broken-image rollout
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yatri-web
  namespace: s12-troubleshoot
  labels:
    app: yatri-web
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: yatri-web
  template:
    metadata:
      labels:
        app: yatri-web
        version: "v1"
    spec:
      containers:
        - name: backend
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: "5m", memory: "16Mi" }
