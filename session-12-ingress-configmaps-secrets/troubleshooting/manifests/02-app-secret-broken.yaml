# INTENTIONALLY BROKEN (from instructor's session-12 troubleshooting/secret-base64-gotcha.md)
# The developer generated the value with:  echo "mypassword" | base64   -> bXlwYXNzd29yZAo=
# 'echo' appended a newline (0x0a), so the app really sends "mypassword\n".
apiVersion: v1
kind: Secret
metadata:
  name: app-db-secret
  namespace: s12-troubleshoot
type: Opaque
data:
  PGUSER: eWF0cmlfYWRtaW4=          # echo -n "yatri_admin" | base64
  PGPASSWORD: bXlwYXNzd29yZAo=      # BUG: echo "mypassword" | base64  (trailing \n)
