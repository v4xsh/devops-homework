# Values used by Argo CD (gitops/). Argo renders the chart with `helm template`, where `lookup` returns nothing,
# so the DB password must come from a Secret created out-of-band instead of being generated by the chart.
config: {appEnv: gitops}
secret: {existingSecret: taskboard-db-gitops}
backend: {replicaCount: 2}
frontend: {replicaCount: 1}
hpa: {enabled: false}
ingress: {host: taskboard-gitops.local}
monitoring:
  grafanaDashboard: {enabled: false}
