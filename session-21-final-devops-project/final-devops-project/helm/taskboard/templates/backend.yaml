{{- $fullname := include "taskboard.fullname" . }}
{{- $image := printf "%s:%s" .Values.backend.image.repository .Values.backend.image.tag }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-backend
  labels: {{- include "taskboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {{- include "taskboard.selectorLabels" (dict "ctx" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "taskboard.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        runAsUser: 10001
        runAsGroup: 10001
      initContainers:
        # schema migrations before the API starts (alembic upgrade is idempotent)
        - name: migrate
          image: {{ $image }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          {{- include "taskboard.backendEnv" . | nindent 10 }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
      containers:
        - name: backend
          image: {{ $image }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - {name: http, containerPort: {{ .Values.backend.port }}}
          {{- include "taskboard.backendEnv" . | nindent 10 }}
          startupProbe:
            httpGet: {path: {{ .Values.backend.probes.livenessPath }}, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: {{ .Values.backend.probes.livenessPath }}, port: http}
            periodSeconds: 15
            timeoutSeconds: 2
          readinessProbe:
            httpGet: {path: {{ .Values.backend.probes.readinessPath }}, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-backend
  labels: {{- include "taskboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  selector: {{- include "taskboard.selectorLabels" (dict "ctx" . "component" "backend") | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.backend.port }}, targetPort: http}
