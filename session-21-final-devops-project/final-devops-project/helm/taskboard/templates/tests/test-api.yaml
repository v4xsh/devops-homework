{{- $fullname := include "taskboard.fullname" . }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ $fullname }}-test-api
  labels: {{- include "taskboard.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: smoke
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          set -e
          wget -qO- http://{{ $fullname }}-backend:{{ .Values.backend.port }}/health
          wget -qO- http://{{ $fullname }}-backend:{{ .Values.backend.port }}/ready
          wget -qO- http://{{ $fullname }}-backend:{{ .Values.backend.port }}/api/tasks/stats
          wget -qO- http://{{ $fullname }}-frontend/healthz
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}
      resources:
        requests: {cpu: 10m, memory: 8Mi}
        limits: {cpu: 50m, memory: 16Mi}
