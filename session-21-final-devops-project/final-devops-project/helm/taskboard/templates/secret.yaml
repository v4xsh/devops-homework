{{- if not .Values.secret.existingSecret }}
{{- $name := printf "%s-db" (include "taskboard.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := .Values.secret.dbPassword }}
{{- if not $password }}
{{- if and $existing $existing.data (index $existing.data .Values.secret.passwordKey) }}
{{- $password = index $existing.data .Values.secret.passwordKey | b64dec }}
{{- else }}
{{- $password = randAlphaNum 24 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "taskboard.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # never delete the DB password together with the release
type: Opaque
data:
  {{ .Values.secret.passwordKey }}: {{ $password | b64enc | quote }}
{{- end }}
