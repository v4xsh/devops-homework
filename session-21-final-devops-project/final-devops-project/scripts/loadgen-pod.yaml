# 30 parallel wget loops against the backend Service -> drives CPU above the HPA target.
apiVersion: v1
kind: Pod
metadata:
  name: loadgen
  namespace: final-app
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: loadgen
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - for i in $(seq 1 30); do (while true; do wget -q -O /dev/null http://taskboard-backend:8000/api/tasks; done) & done; sleep 420
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: ["ALL"]}
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 300m, memory: 64Mi}
