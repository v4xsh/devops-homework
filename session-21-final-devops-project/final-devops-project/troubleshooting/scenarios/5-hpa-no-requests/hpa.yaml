# HPA for the frontend: utilisation = usage / *request*. Without a CPU request there is nothing to divide by.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: taskboard-frontend
  namespace: final-ts
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: taskboard-frontend}
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
