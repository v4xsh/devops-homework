# BROKEN ON PURPOSE (troubleshooting challenge): /api rule points to Service taskboard-api which does not exist -> ingress-nginx returns 503
# Ingress: /api -> backend, / -> frontend (ingress-nginx addon on minikube)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskboard
  namespace: final-ts
  labels: {app.kubernetes.io/part-of: taskboard}
spec:
  ingressClassName: nginx
  rules:
    - host: taskboard-ts.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: {service: {name: taskboard-api, port: {name: http}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: taskboard-frontend, port: {name: http}}}
