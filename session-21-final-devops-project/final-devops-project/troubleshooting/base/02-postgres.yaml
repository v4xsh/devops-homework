# PostgreSQL needs durable storage -> StatefulSet with a PersistentVolumeClaim template (this is where a PVC is required;
# the backend and frontend are stateless and use none).
apiVersion: v1
kind: Service
metadata:
  name: taskboard-postgres
  namespace: final-ts
  labels: {app: taskboard-postgres, app.kubernetes.io/part-of: taskboard}
spec:
  clusterIP: None
  selector: {app: taskboard-postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: taskboard-postgres
  namespace: final-ts
  labels: {app: taskboard-postgres, app.kubernetes.io/part-of: taskboard}
spec:
  serviceName: taskboard-postgres
  replicas: 1
  selector:
    matchLabels: {app: taskboard-postgres}
  template:
    metadata:
      labels: {app: taskboard-postgres, app.kubernetes.io/part-of: taskboard}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - {name: postgres, containerPort: 5432}
          env:
            - name: POSTGRES_DB
              valueFrom: {configMapKeyRef: {name: taskboard-config, key: DB_NAME}}
            - name: POSTGRES_USER
              valueFrom: {configMapKeyRef: {name: taskboard-config, key: DB_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: taskboard-db, key: db-password}}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]}
            initialDelaySeconds: 20
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: run, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: {storage: 1Gi}
