# Throw-away in-cluster Git server (Gitea, SQLite, no persistence) used to demonstrate the full
# commit -> Argo CD sync loop BEFORE the real repo exists on GitHub. Not part of the application.
apiVersion: v1
kind: Namespace
metadata:
  name: final-gitea
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: final-gitea
  labels: {app: gitea}
spec:
  replicas: 1
  selector:
    matchLabels: {app: gitea}
  template:
    metadata:
      labels: {app: gitea}
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: gitea
          image: gitea/gitea:1.24-rootless
          ports:
            - {name: http, containerPort: 3000}
          env:
            - {name: GITEA__security__INSTALL_LOCK, value: "true"}
            - {name: GITEA__database__DB_TYPE, value: sqlite3}
            - {name: GITEA__server__HTTP_PORT, value: "3000"}
            - {name: GITEA__server__ROOT_URL, value: "http://gitea.final-gitea.svc:3000/"}
            - {name: GITEA__service__DISABLE_REGISTRATION, value: "true"}
            - {name: GITEA__repository__DEFAULT_BRANCH, value: main}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          readinessProbe:
            httpGet: {path: /api/healthz, port: http}
            periodSeconds: 5
          resources:
            requests: {cpu: 20m, memory: 96Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/gitea}
            - {name: config, mountPath: /etc/gitea}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: data, emptyDir: {}}
        - {name: config, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: final-gitea
spec:
  selector: {app: gitea}
  ports:
    - {name: http, port: 3000, targetPort: http}
