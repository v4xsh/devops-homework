# Source: taskboard/templates/monitoring.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: taskboard-alerts
  labels:
    helm.sh/chart: taskboard-1.0.1
    app.kubernetes.io/name: taskboard
    app.kubernetes.io/instance: taskboard
    app.kubernetes.io/version: "1.0.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: taskboard
spec:
  groups:
    - name: taskboard.rules
      rules:
        - alert: TaskboardBackendDown
          expr: absent(up{namespace="final-app", service="taskboard-backend"} == 1)
          for: 1m
          labels: {severity: critical, app: taskboard}
          annotations:
            summary: "TaskBoard backend has no healthy scrape targets in final-app"
        - alert: TaskboardHigh5xxRate
          expr: |
            sum(rate(http_requests_total{namespace="final-app", service="taskboard-backend", status="5xx"}[5m]))
              / clamp_min(sum(rate(http_requests_total{namespace="final-app", service="taskboard-backend"}[5m])), 0.001) > 0.05
          for: 5m
          labels: {severity: warning, app: taskboard}
          annotations:
            summary: "More than 5% of TaskBoard API requests fail with 5xx"
        - alert: TaskboardHighLatencyP95
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace="final-app", service="taskboard-backend"}[5m]))) > 0.5
          for: 5m
          labels: {severity: warning, app: taskboard}
          annotations:
            summary: "TaskBoard API p95 latency above 500ms"
        - alert: TaskboardPodRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="final-app", pod=~"taskboard-.*"}[15m]) > 3
          for: 1m
          labels: {severity: warning, app: taskboard}
          annotations:
            summary: "Pod {{ $labels.pod }} restarted more than 3 times in 15m"
        - alert: TaskboardDatabaseNotReady
          expr: kube_statefulset_status_replicas_ready{namespace="final-app", statefulset="taskboard-postgres"} < 1
          for: 2m
          labels: {severity: critical, app: taskboard}
          annotations:
            summary: "TaskBoard PostgreSQL has no ready replica"
