apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: taskboard-backend
  labels:
    helm.sh/chart: taskboard-1.0.1
    app.kubernetes.io/name: taskboard
    app.kubernetes.io/instance: taskboard
    app.kubernetes.io/version: "1.0.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: taskboard
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: taskboard
      app.kubernetes.io/instance: taskboard
      app.kubernetes.io/component: backend
  namespaceSelector:
    matchNames: [final-app]
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
