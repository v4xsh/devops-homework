apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rollback-demo.fullname" . }}-page
  labels:
    {{- include "rollback-demo.labels" . | nindent 4 }}
data:
  index.html: |
    release={{ .Release.Name }} rendered-at-revision={{ .Release.Revision }} chart={{ .Chart.Name }}-{{ .Chart.Version }}
    version={{ .Values.app.version }} color={{ .Values.app.color }} image={{ .Values.image.repository }}:{{ .Values.image.tag }} replicas={{ .Values.replicaCount }}
    message={{ .Values.app.message }}
