# Custom Semgrep (SAST) rules for this project - run as: semgrep scan --config .semgrep.yml app
rules:
  - id: flask-debug-enabled
    languages: [python]
    severity: ERROR
    message: Flask app run with debug=True exposes the Werkzeug debugger (remote code execution).
    pattern: $APP.run(..., debug=True, ...)
    metadata: {cwe: "CWE-489: Active Debug Code", owasp: "A05:2021 Security Misconfiguration"}

  - id: subprocess-shell-true
    languages: [python]
    severity: ERROR
    message: subprocess called with shell=True - command injection risk if any argument is user controlled.
    pattern-either:
      - pattern: subprocess.$FUNC(..., shell=True, ...)
      - pattern: os.system(...)
    metadata: {cwe: "CWE-78: OS Command Injection", owasp: "A03:2021 Injection"}

  - id: eval-or-exec
    languages: [python]
    severity: ERROR
    message: eval()/exec() on data can execute arbitrary code.
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)
    metadata: {cwe: "CWE-95: Eval Injection", owasp: "A03:2021 Injection"}

  - id: unsafe-yaml-load
    languages: [python]
    severity: ERROR
    message: yaml.load without SafeLoader can construct arbitrary Python objects. Use yaml.safe_load.
    patterns:
      - pattern: yaml.load(...)
      - pattern-not: yaml.load(..., Loader=yaml.SafeLoader, ...)
    metadata: {cwe: "CWE-502: Deserialization of Untrusted Data", owasp: "A08:2021"}

  - id: pickle-loads
    languages: [python]
    severity: ERROR
    message: pickle.loads on untrusted data leads to code execution.
    pattern: pickle.loads(...)
    metadata: {cwe: "CWE-502: Deserialization of Untrusted Data", owasp: "A08:2021"}

  - id: weak-hash-md5-sha1
    languages: [python]
    severity: WARNING
    message: MD5/SHA1 are broken for security purposes - use SHA-256 or a password hash (bcrypt/argon2).
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)
    metadata: {cwe: "CWE-327: Broken or Risky Cryptographic Algorithm", owasp: "A02:2021"}

  - id: requests-verify-false
    languages: [python]
    severity: WARNING
    message: TLS certificate verification disabled.
    pattern: requests.$METHOD(..., verify=False, ...)
    metadata: {cwe: "CWE-295: Improper Certificate Validation", owasp: "A07:2021"}

  - id: sql-string-format
    languages: [python]
    severity: ERROR
    message: SQL built with string formatting - use parameterised queries.
    pattern-either:
      - pattern: $CUR.execute(f"...")
      - pattern: $CUR.execute("..." % ...)
      - pattern: $CUR.execute("..." + ...)
    metadata: {cwe: "CWE-89: SQL Injection", owasp: "A03:2021 Injection"}
